<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熙 · 会员推荐 Banner 预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f5f6f8; display:flex; flex-direction:column; align-items:center; gap:14px; padding:18px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif; }
  .phone { width:375px; background:#f5f6f8; }
  .topbar { background:#fff; display:flex; align-items:center; padding:10px 14px; border-bottom:1px solid #eee; }
  .logo { margin-right:auto; font-weight:700; color:#333; font-size:15px; }
  .logo i { color:#ff5a6e; }
  .tabs { display:flex; gap:4px; }
  .tab { font-size:13px; color:#888; padding:4px 8px; border-radius:6px; }
  .tab.active { color:#ff5a6e; background:#fff0f2; font-weight:600; }
  .safety { background:#fff7e6; color:#d48806; font-size:11.5px; padding:6px 14px; }
  .carousel { border-radius:14px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.08); margin:12px 14px 0; }
  .slide { position:relative; width:100%; height:160px; }
  .slide img { width:100%; height:100%; display:block; }
  .hint { color:#999; font-size:11px; text-align:center; max-width:375px; line-height:1.5; }
  .full { width:750px; max-width:96vw; border-radius:10px; box-shadow:0 4px 16px rgba(0,0,0,.12); }
  .label { font-size:12px; color:#666; font-weight:600; }
</style>
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="logo"><i>♥</i> StarMeet</div>
      <nav class="tabs">
        <span class="tab active">首页</span>
        <span class="tab">找缘分</span>
        <span class="tab">活动</span>
        <span class="tab">会员</span>
      </nav>
    </header>
    <div class="safety">⚠ 警惕酒托饭托婚托借约会骗取消费，平台仅做资料展示</div>
    <div class="carousel">
      <div class="slide"><img src="assets/images/banner-xi.png" alt="熙 banner"></div>
    </div>
  </div>

  <div class="label">2x 高清原图（750×320，整图缩放未裁切）</div>
  <img class="full" src="assets/images/banner-xi.png" alt="熙 banner 2x">

  <div class="hint">
    熙 的底图用了你发的原图，整张缩放铺满 Banner（未重新裁切），套上和 Cindy 同款的斜向品牌渐变蒙层。<br>
    点击下方「立即了解」将跳转 member.html?id=7（熙 的个人主页）。
  </div>
</body>
</html>
