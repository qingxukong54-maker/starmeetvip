<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>问卷调查 Banner — 预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#f5f6f8;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
    padding:30px 16px 60px; gap:24px;
  }
  .label { font-size:13px; color:#666; font-weight:600; align-self:flex-start; max-width:780px; }
  /* 模拟手机环境 */
  .phone-frame {
    width:375px; background:#fff; border-radius:20px; overflow:hidden;
    box-shadow:0 4px 30px rgba(0,0,0,.15); padding-top:12px;
  }
  .nav { height:44px; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#333; }
  .banner-wrap { margin:8px 12px; border-radius:14px; overflow:hidden; }
  .banner-wrap img { width:100%; height:auto; display:block; }

  /* 大图展示 */
  .big-preview {
    width:min(750px, 95vw); border-radius:18px; overflow:hidden;
    box-shadow:0 4px 28px rgba(0,0,0,.12);
  }
  .big-preview img { width:100%; height:auto; display:block; }

  .hint { font-size:12px; color:#aaa; text-align:center; max-width:780px; line-height:1.6; }
</style>
</head>
<body>

  <div class="label">① 手机环境预览（真实轮播尺寸）</div>
  <div class="phone-frame">
    <div class="nav">StarMeet · 跨界交友</div>
    <div class="banner-wrap">
      <img src="C:/Users/Administrator/WorkBuddy/Claw/assets/images/banner-survey.png">
    </div>
  </div>

  <div class="label">② 高清大图（2x，可直接导出使用）</div>
  <div class="big-preview">
    <img src="C:/Users/Administrator/WorkBuddy/Claw/assets/images/banner-survey.png">
  </div>

  <div class="hint">
    文案：<br>
    <b>StarMeet 创始会员招募</b>（粗体）<br>
    <b>真人认证 · 人工审核 · 高质量会员</b>（粗体，醒目）<br>
    我们坚信，只有真诚，才值得认真对待。<br>
    诚邀同频的你，共建真诚的交友社区。<br><br>
    背景底图：用户提供的品牌渐变（带两个光斑圆）。
    二维码：真实问卷链接二维码。
  </div>

</body>
</html>
