<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mike · StarMeet 个人资料卡</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:linear-gradient(160deg,#ffe9ec 0%,#fff4ee 45%,#f3f4f8 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; padding:28px 12px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }

  /* ===== 卡片本体 ===== */
  .card {
    width:480px; background:#fff; border-radius:26px; overflow:hidden;
    box-shadow:0 22px 60px rgba(255,90,110,.22), 0 6px 16px rgba(0,0,0,.08);
    position:relative;
  }

  /* 顶部品牌条 */
  .brandbar {
    display:flex; align-items:center; gap:8px; padding:14px 20px 12px;
  }
  .brand-logo {
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(135deg,#ff5a6e,#ff8a3d);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px;
    box-shadow:0 3px 8px rgba(255,90,110,.4);
  }
  .brand-name { font-weight:800; font-size:16px; color:#2b2b2b; letter-spacing:.5px; }
  .brand-sub { font-size:11px; color:#b0b0b0; margin-left:2px; }
  .brand-tip {
    margin-left:auto; font-size:11px; color:#ff5a6e; background:#fff0f2;
    padding:4px 10px; border-radius:20px; font-weight:600;
  }

  /* Hero 大图 */
  .hero { position:relative; width:100%; height:280px; background:#f0f1f4; overflow:hidden; }
  .hero img { width:100%; height:100%; object-fit:cover; object-position:center 30%; display:block; }
  .hero-fallback {
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#ff5a6e,#ff8a3d); color:#fff; font-size:80px; font-weight:800;
  }
  .hero-scrim {
    position:absolute; left:0; right:0; bottom:0; height:120px;
    background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 100%);
  }
  .avatar {
    position:absolute; left:18px; bottom:-28px; width:60px; height:60px; border-radius:50%;
    border:3px solid #fff; object-fit:cover; background:#eee; box-shadow:0 3px 10px rgba(0,0,0,.18);
  }
  .nameplate { position:absolute; left:18px; bottom:12px; color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.4); }
  .nameplate .nm { font-size:21px; font-weight:800; display:flex; align-items:center; gap:7px; }
  .nameplate .gen { font-size:12px; }
  .nameplate .uid { font-size:11.5px; opacity:.9; margin-top:2px; letter-spacing:.5px; }
  .nameplate .sub { font-size:12.5px; opacity:.92; margin-top:2px; }

  /* 内容区 */
  .body { padding:18px 20px 20px; }

  .tags { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
  .tag {
    background:#fff0f2; color:#ff5a6e; font-size:12px; font-weight:600;
    padding:5px 11px; border-radius:20px;
  }
  .tag.soft { background:#f4f5f7; color:#7a7f88; }

  .sec-title {
    font-size:13px; font-weight:700; color:#ff5a6e; margin:4px 0 8px;
    display:flex; align-items:center; gap:6px;
  }
  .sec-title::before { content:''; width:4px; height:13px; border-radius:3px; background:linear-gradient(135deg,#ff5a6e,#ff8a3d); }
  .intro { font-size:14px; line-height:1.75; color:#555; margin-bottom:18px; }

  /* 生活照网格 */
  .photos { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:18px; }
  .photos img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:12px; background:#eee; display:block; }
  .photo-fill {
    aspect-ratio:1/1; border-radius:12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px; color:#fff; font-size:11px; text-align:center;
    background:linear-gradient(135deg,#ff5a6e,#ff8a3d); opacity:.92;
  }
  .photo-fill i { font-size:20px; }

  /* Slogan 横幅 */
  .slogan {
    background:linear-gradient(135deg,#ff5a6e 0%,#ff8a3d 100%);
    border-radius:18px; padding:18px 20px; color:#fff; margin-bottom:18px;
    box-shadow:0 10px 26px rgba(255,90,110,.32);
  }
  .slogan .big { font-size:20px; font-weight:800; letter-spacing:1px; line-height:1.3; }
  .slogan .small { font-size:12.5px; opacity:.92; margin-top:6px; letter-spacing:.5px; }

  /* 底部二维码 */
  .qrbox {
    display:flex; align-items:center; gap:14px; background:#f7f8fa; border-radius:18px;
    padding:14px 16px; border:1px solid #eef0f3;
  }
  .qrbox img { width:96px; height:96px; border-radius:10px; background:#fff; padding:5px; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .qr-text .t1 { font-size:15px; font-weight:800; color:#2b2b2b; }
  .qr-text .t2 { font-size:12.5px; color:#888; margin-top:5px; }
  .qr-text .t3 { font-size:12px; color:#ff5a6e; font-weight:600; margin-top:7px; }

  .footer {
    text-align:center; font-size:11px; color:#b6b6b6; padding:16px 0 4px; letter-spacing:1px;
  }

  .hint { color:#9aa; font-size:12px; margin-top:16px; text-align:center; }

  /* 导出模式：隐藏提示、收紧留白，便于整页截图 */
  body.export { padding:24px 20px; min-height:0; }
  body.export .hint { display:none; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="brandbar">
    <div class="brand-logo">♥</div>
    <div class="brand-name">StarMeet</div>
    <div class="brand-sub">· 跨界交友</div>
    <div class="brand-tip">优质会员展示</div>
  </div>

  <div class="hero">
    <img id="heroImg" alt="">
    <div class="hero-scrim"></div>
    <img class="avatar" id="avatarImg" alt="" style="display:none;">
    <div class="nameplate">
      <div class="nm"><span id="pName">—</span><span class="gen" id="pGen"></span></div>
      <div class="uid" id="pUid">—</div>
      <div class="sub" id="pSub">—</div>
    </div>
  </div>

  <div class="body">
    <div class="tags" id="tags"></div>

    <div class="sec-title">个人介绍</div>
    <div class="intro" id="intro">—</div>

    <div class="sec-title" id="secPhotos">生活照</div>
    <div class="photos" id="photos"></div>

    <div class="slogan">
      <div class="big" id="sloganBig">希望找到理想伴侣，组建幸福家庭</div>
      <div class="small" id="sloganSmall">STARMEET · 让每一次相遇都值得认真对待</div>
    </div>

    <div class="qrbox">
      <img id="qrImg" src="assets/images/service-qr.png" alt="平台二维码">
      <div class="qr-text">
        <div class="t1">扫码加入 StarMeet</div>
        <div class="t2">长按识别二维码，遇见更多同频的人</div>
        <div class="t3" id="qrWechat">客服微信：starmeet_vip</div>
      </div>
    </div>

    <div class="footer">STARMEET · 真诚交友，遇见对的人</div>
  </div>
</div>

<div class="hint">📸 手机/电脑截图此卡片即可发朋友圈（建议竖屏全卡截取）</div>

<!-- 复用站点会员数据 -->
<script src="assets/js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var id = params.get('id') || '00018';
    var slogan = params.get('slogan');
    if (params.get('export') === '1') document.body.classList.add('export');

    var M = window.MEMBERS;
    // 等待 main.js 把数据挂上（DOMContentLoaded 后才构建）
    function render() {
      var m = (window.resolveMember && window.resolveMember(id)) || (M && (M[id] || M['17'] || M['1']));
      if (!m) { document.getElementById('pName').textContent = '暂无数据'; return; }

      // Hero 大图：优先详情页配图（玩具狗合影等生活照），其次头像
      var heroSrc = m.detailPhoto || m.photo;
      var hero = document.getElementById('heroImg');
      if (heroSrc) {
        hero.src = heroSrc;
        hero.onerror = function () {
          this.style.display = 'none';
          var fb = document.createElement('div');
          fb.className = 'hero-fallback';
          fb.textContent = m.name.charAt(0);
          this.parentNode.insertBefore(fb, this);
        };
      } else {
        var fb = document.createElement('div');
        fb.className = 'hero-fallback';
        fb.textContent = m.name.charAt(0);
        hero.parentNode.appendChild(fb);
        hero.style.display = 'none';
      }

      // 头像（按需求隐藏，只保留主图）
      document.getElementById('avatarImg').style.display = 'none';

      // 姓名 + 性别 + 交友ID
      document.getElementById('pName').textContent = m.name;
      document.getElementById('pGen').textContent = m.gender === '女' ? '♀' : '♂';
      document.getElementById('pUid').textContent = m.uid ? '交友ID: ' + m.uid : '';
      document.getElementById('pSub').textContent = (m.age ? m.age + '岁' : '') + (m.city ? ' · ' + m.city : '');

      // 标签
      var tagList = [];
      if (m.age) tagList.push(m.age + '岁');
      if (m.city) tagList.push(m.city);
      if (m.job) tagList.push(m.job);
      if (m.height) tagList.push(m.height + 'cm');
      if (m.zodiac) tagList.push(m.zodiac);
      if (m.education) tagList.push(m.education);
      if (m.marriage) tagList.push(m.marriage);
      var tagsBox = document.getElementById('tags');
      tagList.forEach(function (t) {
        var s = document.createElement('span');
        s.className = 'tag';
        s.textContent = t;
        tagsBox.appendChild(s);
      });

      // 介绍
      document.getElementById('intro').textContent = m.intro || '这个人很神秘，等你来认识～';

      // 生活照网格：只有 1 张照片时，同一张显示 2 张（避免区块空缺或撑满）；最多 3 张
      var photoSet = {};
      var uniquePhotos = [];
      [m.photo, m.detailPhoto].forEach(function (p) {
        if (p && !photoSet[p]) { photoSet[p] = 1; uniquePhotos.push(p); }
      });
      var displayPhotos = [];
      if (uniquePhotos.length === 0) {
        displayPhotos = [];
      } else if (uniquePhotos.length === 1) {
        displayPhotos = [uniquePhotos[0], uniquePhotos[0]]; // 仅 1 张 → 同张显示 2 张
      } else {
        displayPhotos = uniquePhotos.slice(0, 3);
      }
      var secPhotos = document.getElementById('secPhotos');
      var grid = document.getElementById('photos');
      if (displayPhotos.length === 0) {
        if (secPhotos) secPhotos.style.display = 'none';
        if (grid) grid.style.display = 'none';
      } else {
        grid.style.gridTemplateColumns = 'repeat(' + Math.min(displayPhotos.length, 3) + ', 1fr)';
        displayPhotos.forEach(function (src) {
          var im = document.createElement('img');
          im.src = src;
          im.onerror = function () { this.style.visibility = 'hidden'; };
          grid.appendChild(im);
        });
      }

      // Slogan
      if (slogan) document.getElementById('sloganBig').textContent = slogan;
    }

    // main.js 在 DOMContentLoaded 内构建数据，确保已挂载
    if (window.MEMBERS && Object.keys(window.MEMBERS).length) {
      render();
    } else {
      document.addEventListener('DOMContentLoaded', function () { setTimeout(render, 0); });
      // 兜底：部分浏览器 DOMContentLoaded 已触发
      setTimeout(function () { if (window.MEMBERS) render(); }, 60);
    }

    document.title = (window.resolveMember && window.resolveMember(id)) ? (window.resolveMember(id)).name + ' · StarMeet' : 'StarMeet 资料卡';
  })();
</script>
</body>
</html>
