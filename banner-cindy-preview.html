<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日会员推荐 - Cindy</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#f5f6f8; display:flex; justify-content:center; align-items:center;
    min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',sans-serif;
    padding:12px;
  }

  /* ===== 模拟首页容器（与真实站一致） ===== */
  .phone-frame {
    width:375px; background:#f5f6f8;
  }
  .topbar {
    background:#fff; display:flex; align-items:center;
    padding:10px 14px; border-bottom:1px solid #eee;
  }
  .logo { display:flex; align-items:center; gap:6px; margin-right:auto; font-weight:700; color:#333; font-size:15px; }
  .logo i { color:#ff5a6e; }
  .tabs { display:flex; gap:4px; }
  .tab { font-size:13px; color:#888; padding:4px 8px; text-decoration:none; border-radius:6px; }
  .tab.active { color:#ff5a6e; background:#fff0f2; font-weight:600; }

  .safety-tip {
    background:#fff7e6; color:#d48806; font-size:11.5px; padding:6px 14px;
    display:flex; align-items:center; gap:4px;
  }

  /* ===== 轮播区（真实尺寸：100%宽 × 160px高） ===== */
  .banner-carousel {
    position:relative; border-radius:14px; overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08); margin:12px 14px 0;
  }
  .banner-slide {
    position:relative; width:100%; height:160px;
    overflow:hidden;
  }
  .banner-bg {
    position:absolute;top:0;left:0;width:100%;height:100%;
    object-fit:cover; object-position:center 35%;
  }
  .banner-overlay {
    position:absolute;top:0;left:0;width:100%;height:100%;
    background:
      linear-gradient(110deg, rgba(255,90,110,0.90) 0%, rgba(255,138,61,0.65) 42%, rgba(255,90,110,0.08) 72%, transparent 100%),
      linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,0.50) 100%);
    z-index:1;
  }

  /* 右侧人物裁切 - 放大到红框大小，上半身填满右侧区域 */
  .photo-mask {
    position:absolute; top:0; right:0;
    width:58%; height:100%; z-index:0;
    clip-path:polygon(28% 0%, 100% 0%, 100% 100%, 8% 100%);
    overflow:hidden;
  }
  .photo-mask img {
    width:170%; height:180%;
    object-fit:cover;
    object-position:28% 35%;
    margin-left:-42%;
    margin-top:-30%;
  }

  /* 文字内容 */
  .content {
    position:absolute; top:0; left:0;width:55%;height:100%;
    padding:18px 14px 16px; z-index:2;
    display:flex; flex-direction:column; justify-content:flex-start;
  }
  .badge-row { display:flex; gap:5px; margin-bottom:4px; }
  .badge {
    background:rgba(255,255,255,0.22); backdrop-filter:blur(10px);
    color:#fff; font-size:10px; padding:3px 8px; border-radius:20px;
    letter-spacing:0.4px; border:1px solid rgba(255,255,255,0.22);
  }
  .tagline {
    color:rgba(255,255,255,0.82); font-size:10px; letter-spacing:1.2px;
    margin-bottom:2px; font-weight:500;
  }
  .title {
    color:#fff; font-size:21px; line-height:1.2; font-weight:800;
    text-shadow:0 2px 10px rgba(0,0,0,0.2);
  }
  .title em { font-style:normal; background:linear-gradient(135deg,#fffde7,#ffe082); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .subtitle {
    color:rgba(255,255,255,0.9); font-size:11.5px; line-height:1.45;
    margin-top:2px; max-width:190px;
  }
  .info-bar { display:flex; gap:6px; margin-top:auto; flex-wrap:wrap; }
  .chip {
    background:rgba(255,255,255,0.17); backdrop-filter:blur(8px);
    color:#fff; font-size:10px; padding:3px 7px; border-radius:6px;
    border:1px solid rgba(255,255,255,0.18);
  }

  /* CTA 按钮 */
  .cta-wrap { position:absolute; right:14px; bottom:12px; z-index:3; }
  .cta-btn {
    display:inline-flex; align-items:center; gap:4px;
    background:linear-gradient(135deg,#fff,#fef7e8);
    color:#ff5a6e; font-size:11.5px; font-weight:700; padding:7px 14px;
    border-radius:20px; border:none; cursor:pointer;
    box-shadow:0 3px 12px rgba(255,90,110,0.38), inset 0 1px 0 rgba(255,255,255,0.85);
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .cta-btn:hover { transform:translateY(-1px); box-shadow:0 4px 16px rgba(255,90,110,0.48); }
  .cta-btn i { font-size:9px; }

  /* 轮播指示器 */
  .banner-dots {
    position:absolute; right:10px; bottom:10px; z-index:4;
    display:flex; gap:4px;
  }
  .dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.55); }
  .dot.active { background:#fff; width:14px; border-radius:3px; }

  /* 底部提示 */
  .hint {
    text-align:center; color:#bbb; font-size:11px; margin-top:10px;
  }
</style>
</head>
<body>

<div class="phone-frame">
  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="logo"><i class="fas fa-heart"></i> StarMeet</div>
    <nav class="tabs">
      <a class="tab active" href="#">首页</a>
      <a class="tab" href="#">找缘分</a>
      <a class="tab" href="#">活动</a>
      <a class="tab" href="#">会员</a>
    </nav>
  </header>

  <div class="safety-tip">
    <i class="fas fa-exclamation-triangle"></i> 警惕酒托饭托婚托借约会骗取消费，平台仅做资料展示
  </div>

  <!-- ===== 轮播 Banner（真实尺寸 100% × 160px） ===== -->
  <div class="banner-carousel">
    <div class="banner-slide">
      <img class="banner-bg" src="assets/images/banner-cindy.jpg" alt="">
      <div class="banner-overlay"></div>

      <div class="photo-mask">
        <img src="assets/images/banner-cindy.jpg" alt="Cindy">
      </div>

      <div class="content">
        <div class="badge-row">
          <span class="badge">🔥 今日会员推荐</span>
        </div>
        <div class="tagline">STARMEET · 跨界交友</div>
        <div class="title"><em>Cindy</em> · 福州</div>
        <div class="subtitle">
          喜静不喜争，心安即富足<br>
          精神世界的饱满，胜于一切
        </div>
        <div class="info-bar">
          <span class="chip">48岁</span>
          <span class="chip">白领</span>
          <span class="chip">水瓶座</span>
        </div>
      </div>

      <div class="cta-wrap">
        <button class="cta-btn" onclick="alert('跳转 → member.html?id=9')">
          立即了解 <i>→</i>
        </button>
      </div>

      <div class="banner-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>
</div>

<div class="hint">Banner 尺寸：100%宽 × 160px（与真实轮播一致）· 放在安全提示下方</div>

</body>
</html>
