<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b9d">
  <title>活动 - StarMeet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo">
        <i class="fas fa-heart"></i>
        <span class="logo-text">
          <span class="site-name">StarMeet</span>
          <span class="site-slogan">跨界交友</span>
        </span>
      </div>
      <nav class="tabs">
        <a class="tab" href="index.html">首页</a>
        <a class="tab" href="match.html">找缘分</a>
        <a class="tab active" href="activity.html">活动</a>
        <a class="tab" href="javascript:void(0)" onclick="App.openService()">会员</a>
      </nav>
    </header>

    <div class="safety-tip"><i class="fas fa-exclamation-triangle"></i> 警惕酒托饭托婚托借约会骗取消费，平台仅做资料展示</div>

    <main class="content">
      <div class="page active">
        <div class="filter-bar" id="actFilterBar">
          <div class="chip active" data-filter="">全部</div>
          <div class="chip" data-filter="open">报名中</div>
          <div class="chip" data-filter="ended">已结束</div>
        </div>

        <div id="actListBox">
          <div class="act-card" data-status="报名中" onclick="location.href='activity-detail.html?id=1'">
            <img data-custom="assets/images/banner-survey.png" src="" style="background:linear-gradient(135deg,#ff5a6e,#ff8a3d);">
            <div class="body">
              <h3>创始会员招募 填写问卷 加入华人社交圈 提升圈层</h3>
              <div class="meta">🕒 07.19 - 08.15<br>📍 线上活动</div>
              <div class="footer">
                <span class="price free">免费</span>
                <span class="meta">4人已报名</span>
                <span class="join-btn">报名中</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <nav class="bottombar">
      <a class="btm-btn" href="index.html"><i class="fas fa-home"></i><span>首页</span></a>
      <a class="btm-btn" href="match.html"><i class="fas fa-heart"></i><span>找缘分</span></a>
      <a class="btm-btn active" href="activity.html"><i class="fas fa-calendar-alt"></i><span>活动</span></a>
      <a class="btm-btn" href="javascript:void(0)" onclick="App.openService()"><i class="fas fa-crown"></i><span>会员</span></a>
    </nav>

    <div class="fab-container">
      <a class="fab-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-chevron-up"></i></a>
      <a class="fab-btn" onclick="App.openService()"><i class="fas fa-headset"></i></a>
    </div>

    <!-- 客服弹窗 -->
    <div class="modal-mask" id="serviceModal" onclick="if(event.target===this)App.closeService()">
      <div class="service-card">
        <button class="modal-close" onclick="App.closeService()"><i class="fas fa-times"></i></button>
        <div class="service-head"><i class="fas fa-headset"></i><span id="serviceNameVal">StarMeet 客服小助手</span></div>
        <div class="service-qr"><img id="serviceQrImg" src="" alt="客服微信二维码"></div>
        <div class="service-tip">长按二维码识别，或添加下方微信号</div>
        <div class="service-wechat" onclick="App.copyWechat()" title="点击复制">
          <span class="wx-label">微信号</span>
          <span class="wx-id" id="serviceWechatVal">starmeet_vip</span>
          <i class="fas fa-copy"></i>
        </div>
        <div class="service-copy-hint">点击上方微信号即可复制</div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
