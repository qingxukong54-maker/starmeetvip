<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff6b9d">
  <title>找缘分 - StarMeet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="logo">
        <i class="fas fa-heart"></i>
        <span class="logo-text">
          <span class="site-name">StarMeet</span>
          <span class="site-slogan">跨界交友</span>
        </span>
      </div>
      <nav class="tabs">
        <a class="tab" href="index.html">首页</a>
        <a class="tab active" href="match.html">找缘分</a>
        <a class="tab" href="activity.html">活动</a>
        <a class="tab" href="javascript:void(0)" onclick="App.openService()">会员</a>
      </nav>
    </header>

    <div class="safety-tip"><i class="fas fa-exclamation-triangle"></i> 警惕酒托饭托婚托借约会骗取消费，平台仅做资料展示</div>

    <main class="content">
      <div class="page active">
        <div class="filter-bar" id="filterBar">
          <div class="chip active" data-gender="">全部</div>
          <div class="chip" data-gender="女">找女生</div>
          <div class="chip" data-gender="男">找男生</div>
          <div class="chip" onclick="App.toast('高级筛选开发中')"><span>🔍 筛选</span></div>
        </div>

        <div id="activeFilters" style="display:none;padding:6px 12px;background:#fff;border-radius:10px;margin-bottom:8px;font-size:12px;color:var(--text-2);"></div>

        <div class="user-grid" id="userGrid"><!-- 由 main.js 数据驱动渲染：真实头像优先，其次更新时间倒序 --></div>

        <div id="loadMore" style="text-align:center; padding:16px; color:var(--text-3); font-size:13px;">上滑加载更多</div>
      </div>
    </main>

    <nav class="bottombar">
      <a class="btm-btn" href="index.html"><i class="fas fa-home"></i><span>首页</span></a>
      <a class="btm-btn active" href="match.html"><i class="fas fa-heart"></i><span>找缘分</span></a>
      <a class="btm-btn" href="activity.html"><i class="fas fa-calendar-alt"></i><span>活动</span></a>
      <a class="btm-btn" href="javascript:void(0)" onclick="App.openService()"><i class="fas fa-crown"></i><span>会员</span></a>
    </nav>

    <div class="fab-container">
      <a class="fab-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"><i class="fas fa-chevron-up"></i></a>
      <a class="fab-btn" onclick="App.openService()"><i class="fas fa-headset"></i></a>
    </div>

    <!-- 客服弹窗 -->
    <div class="modal-mask" id="serviceModal" onclick="if(event.target===this)App.closeService()">
      <div class="service-card">
        <button class="modal-close" onclick="App.closeService()"><i class="fas fa-times"></i></button>
        <div class="service-head"><i class="fas fa-headset"></i><span id="serviceNameVal">StarMeet 客服小助手</span></div>
        <div class="service-qr"><img id="serviceQrImg" src="" alt="客服微信二维码"></div>
        <div class="service-tip">长按二维码识别，或添加下方微信号</div>
        <div class="service-wechat" onclick="App.copyWechat()" title="点击复制">
          <span class="wx-label">微信号</span>
          <span class="wx-id" id="serviceWechatVal">starmeet_vip</span>
          <i class="fas fa-copy"></i>
        </div>
        <div class="service-copy-hint">点击上方微信号即可复制</div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
